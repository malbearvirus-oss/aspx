<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>See for yourself.</title>
  <style>
    body {
      background-color: #000000;
      color: #cccccc;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      margin: 0;
    }
    .terminal {
      max-width: 700px;
      margin: 0 auto;
    }
    .line {
      margin-bottom: 10px;
      word-break: break-all;
      line-height: 1.4;
    }
    .input-container {
      display: flex;
      align-items: center;
    }
    input {
      background: transparent;
      border: none;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      flex-grow: 1;
      margin-left: 5px;
    }
    .success {
      color: #ffffff;
      font-weight: bold;
    }
    .error {
      color: #aaaaaa;
    }
  </style>
</head>
<body>

<div class="terminal" id="terminal">
  <div class="line">====================================================================</div>
  <div class="line">  stage 1</div>
  <div class="line">====================================================================</div>
  <br>
  <div class="line">Directives: Enter the first password to unlock the terminal.</div>
  <br>
  <div class="line input-container">
    <span>&gt;&gt; Enter Password 1: </span>
    <input type="text" id="commandInput" autofocus autocomplete="off" spellcheck="false">
  </div>
</div>

<script>
  let stage = 1;
  const terminal = document.getElementById('terminal');

  // Foco automático ao clicar em qualquer lugar da tela
  document.addEventListener('click', () => {
    const activeInput = document.getElementById('commandInput');
    if (activeInput) activeInput.focus();
  });

  // Ouve o Enter em qualquer input que existir no terminal
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'commandInput') {
      const input = e.target;
      const val = input.value.trim();
      
      const echoDiv = document.createElement('div');
      echoDiv.className = 'line';
      
      if (stage === 1) {
        echoDiv.textContent = `>> Enter Password 1: ${val}`;
        terminal.insertBefore(echoDiv, input.parentNode);
        input.value = '';

        if (val.toLowerCase() === 'stars') {
          printMessage('[OK] Stage 1 bypass successful!', 'success');
          stage = 2;
          setTimeout(loadStage2, 1500);
        } else {
          printMessage('[ERROR] Invalid password. Access denied. Try again.', 'error');
        }
      } else if (stage === 2) {
        echoDiv.textContent = `>> Enter authorization key: ${val}`;
        terminal.insertBefore(echoDiv, input.parentNode);
        input.value = '';

        // Aceita tanto BLAME_JONH quanto BALME_JONH para evitar travamentos por digitação
        if (val.toUpperCase() === 'BLAME_JONH' || val.toUpperCase() === 'BALME_JONH') {
          printMessage('[OK] Key accepted! Decrypting secondary payload...', 'success');
          stage = 3; // Bloqueia novos envios durante a vitória
          setTimeout(triggerVictory, 2000);
        } else {
          printMessage("Oops, looks like you got it wrong. Try again if you have the patience...", 'error');
        }
      }
    }
  });

  function printMessage(text, className) {
    const currentInput = document.getElementById('commandInput');
    const div = document.createElement('div');
    div.className = `line ${className || ''}`;
    div.textContent = text;
    
    if (currentInput && currentInput.parentNode) {
      terminal.insertBefore(div, currentInput.parentNode);
    } else {
      terminal.appendChild(div);
    }
    window.scrollTo(0, document.body.scrollHeight);
  }

  function loadStage2() {
    terminal.innerHTML = `
      <div class="line">====================================================================</div>
      <div class="line">  stage 2</div>
      <div class="line">====================================================================</div>
      <br>
      <div class="line">Did you really think it would be that easy?</div>
      <div class="line">Let's see if you can guess this one.</div>
      <br>
      <div class="line">Here is a hint: chicken and sword.</div>
      <br>
      <div class="line input-container">
        <span>&gt;&gt; Enter authorization key: </span>
        <input type="text" id="commandInput" autofocus autocomplete="off" spellcheck="false">
      </div>
    `;
    
    const newInput = document.getElementById('commandInput');
    if (newInput) newInput.focus();
  }

  function triggerVictory() {
    const content = `I see you're smart\n\n"Now it seems you've developed a high mental capacity."\n"Maybe, just maybe, you can figure out the rest."\n\npumpkins\n\nrspm`;
    
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'stage_3.txt';
    link.click();

    printMessage('[SUCCESS] Secret file extracted: stage_3.txt', 'success');
    printMessage('Terminating connection in 5 seconds...', 'line');
    
    setTimeout(() => {
      printMessage('[CONNECTION CLOSED]', 'line');
      const input = document.getElementById('commandInput');
      if (input && input.parentNode) {
        input.parentNode.remove();
      }
    }, 5000);
  }
</script>

</body>
</html>
